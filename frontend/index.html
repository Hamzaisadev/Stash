    <title>Stash: toss files between your devices</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Stash",
        "url": "https://stash-ed.vercel.app/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any browser",
        "description": "Move files between your phone and laptop without an account. Drop them in a room, share the link, and everything deletes itself.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <!--
      This is a client-rendered SPA, so the shell ships a real heading and main
      landmark. Crawlers and link previews that do not run JavaScript would
      otherwise see an empty page. React replaces this on mount.
    -->
    <div id="root">
      <main>
        <h1>Stash: toss files between your devices</h1>
        <p>
          Move files between your phone and laptop without an account. Open a
          room, drop your file in, and share the link. Files are up to 100 MB
          each, ten per upload, and rooms delete themselves after 24 hours.
        </p>
        <p><a href="/rooms">Open a room</a></p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
